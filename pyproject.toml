[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restverify"
version = "0.2.0"
description = "Rehearse and verify restic restores locally, on a schedule, with a diff-proof report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
restverify = "restverify.cli:main"

[project.optional-dependencies]
keyring = ["keyring==25.5.0"]
dev = ["pytest==8.3.4", "build==1.6.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/restverify"]

# Sdist is an explicit allowlist, NOT `include everything` — the 0.1.0 sdist
# accidentally shipped five untracked test transcripts (rv_testrun.txt,
# testsuite_*.txt; found in docs/VERIFICATION-0.1.0.md). With `paths`, a
# forgotten file simply does not ship. (I8, R28; I10 added .github/ and
# templates/ so the R44 CI surface ships in source distributions.)
[tool.hatch.build.targets.sdist]
include = [
  "pyproject.toml",
  "README.md",
  "CHANGELOG.md",
  ".github/",
  "templates/",
  "docs/",
  "scripts/",
  "src/",
  "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
